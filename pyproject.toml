[project]
name = "cartoon-niche-radar"
version = "0.1.0"
description = "Empirical research pipeline for AI cartoon short-form niche opportunity scoring across YouTube Shorts, TikTok, and Instagram Reels."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "baruzda" }]
dependencies = [
  "google-api-python-client>=2.130.0",
  "google-auth>=2.29.0",
  "httpx>=0.27.0",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.0",
  "eval-type-backport>=0.2.0",
  "pyyaml>=6.0.1",
  "python-dotenv>=1.0.1",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "sqlalchemy>=2.0.30",
  "jinja2>=3.1.4",
  "plotly>=5.22.0",
  "pytrends>=4.9.2",
  "tenacity>=8.3.0",
  "orjson>=3.10.0",
]

[project.optional-dependencies]
ytdlp = ["yt-dlp>=2024.8.0"]
tiktok = ["TikTokApi>=6.5.0"]
instagram = ["instaloader>=4.11"]
openai = ["openai>=1.30.0"]
dashboard = ["streamlit>=1.35.0"]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
]

[project.scripts]
cnr = "cartoon_niche_radar.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cartoon_niche_radar"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
