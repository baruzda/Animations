# Taxonomy — age clusters, themes, styles, formats
# Labels below are controlled vocabularies used by collectors + classifiers.

age_clusters:
  - id: "2-5"
    label: "2–5"
    keywords:
      - toddler
      - preschool
      - "for kids"
      - nursery
      - "baby songs"
      - "kids cartoon"
  - id: "6-8"
    label: "6–8"
    keywords:
      - "kids animation"
      - "children cartoon"
      - "elementary"
      - "for children"
  - id: "9-12"
    label: "9–12"
    keywords:
      - "tween"
      - "middle school"
      - "kids adventure"
      - "cartoon comedy"
  - id: "13-17"
    label: "13–17"
    keywords:
      - teenager
      - "high school"
      - "for teens"
      - "teen cartoon"
      - "teen animation"
  - id: "18-24"
    label: "18–24 / general"
    keywords:
      - "for adults"
      - "adult animation"
      - workplace
      - "general audience"
      - "college life"

# Control group note: 18-24 is explicitly a control, not a preferred hypothesis.

