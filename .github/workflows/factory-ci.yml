name: Cartoon Factory CI

on:
  push:
    branches:
      - "agent/**"
  pull_request:
    paths:
      - "cartoon_factory/**"
      - "cartoon_niche_radar/pipeline/production_candidates.py"
      - "tests/test_factory_v1.py"
      - "tests/test_runway_provider.py"
      - "pyproject.toml"
      - ".github/workflows/factory-ci.yml"

jobs:
  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Factory tests
        run: pytest -q tests/test_factory_v1.py tests/test_runway_provider.py
      - name: Ruff
        run: >-
          ruff check
          cartoon_factory
          cartoon_niche_radar/pipeline/production_candidates.py
          tests/test_factory_v1.py
          tests/test_runway_provider.py
      - name: Mypy
        run: mypy cartoon_factory
      - name: Fake end-to-end smoke
        run: caf smoke-fake
